[project]
name = "restreserve"
version = "0.1.0"
description = "Resy reservation sniper - books a reservation the instant slots open"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
]

[project.scripts]
restreserve = "restreserve.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restreserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
